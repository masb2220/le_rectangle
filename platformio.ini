[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 9600
build_src_filter = +<*> -<line_test_main.cpp> -<color_test_main.cpp> -<color_calibration_main.cpp> -<line_calibration_main.cpp> -<get_verre_main.cpp>

[env:line_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
build_src_filter = -<*> +<line_test_main.cpp> +<colorReaction.cpp> +<color_sensor.cpp> +<receiveIR.cpp> +<LineFollower/> +<Control/PID_controller.cpp>

[env:color_test]
extends = env:megaatmega2560
build_src_filter = -<*> +<color_test_main.cpp> +<colorReaction.cpp> +<color_sensor.cpp> +<receiveIR.cpp>

[env:color_calibration]
extends = env:megaatmega2560
build_src_filter = -<*> +<color_calibration_main.cpp> +<color_sensor.cpp>

[env:get_verre_test]
extends = env:megaatmega2560
build_src_filter = +<*> -<main.cpp> -<line_test_main.cpp> -<color_test_main.cpp> -<color_calibration_main.cpp> -<line_calibration_main.cpp> -<LineFollower/> -<wall_detour.cpp> -<PathFinding/>

[env:line_calibration]
extends = env:megaatmega2560
build_src_filter = -<*> +<line_calibration_main.cpp> +<LineFollower/> +<Control/PID_controller.cpp>
