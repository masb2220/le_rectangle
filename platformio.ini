[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 9600
build_src_filter = +<*> -<line_test_main.cpp> -<LineFollower/>

[env:line_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
build_src_filter = -<*> +<line_test_main.cpp> +<LineFollower/> +<Control/PID_controller.cpp>
